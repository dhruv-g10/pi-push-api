[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-push-api"
version = "1.0.0"
description = "Lightweight REST API and CLI to push files and run commands on a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "PiPush Author" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "requests>=2.31.0"
]

[project.scripts]
pipush = "client.pipush:main"
